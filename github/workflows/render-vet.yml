name: Render veterans video

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "zip file in the repo root"
        default: "vet_full.zip"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        comp: [Vet00, Vet01, Vet02, Vet03, Vet04, Vet05, Vet06, Vet07, Vet99]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Add the episodes
        run: |
          rm -rf pkg_in
          mkdir pkg_in
          unzip -o "${{ github.event.inputs.zip }}" -d pkg_in
          cd pkg_in
          sed "s#S=/workspace/studio#S=$GITHUB_WORKSPACE/studio#" install.sh > i.sh
          sh i.sh

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Prepare browser
        working-directory: studio
        run: npx remotion browser ensure

      - name: Render
        working-directory: studio
        run: npx remotion render src/index.ts "${{ matrix.comp }}" out/video.mp4 --concurrency=2 --timeout=120000

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.comp }}
          path: studio/out/video.mp4
          if-no-files-found: error
          retention-days: 7

  join:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Join in order
        run: |
          for d in $(ls -d parts/part-* | sort); do echo "file '$PWD/$d/video.mp4'"; done > list.txt
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-veterans-video
          path: final.mp4
          if-no-files-found: error
          retention-days: 7
