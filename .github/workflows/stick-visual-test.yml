
name: Stick Visual Browser Test

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/stick-visual-feedback-loop
    paths:
      - ".github/workflows/stick-visual-test.yml"

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Stick engine
        run: |
          git clone https://github.com/hmelberg/stick.git /tmp/stick
          git -C /tmp/stick checkout 698e9a783eb2b9e58a762311f8da0670a1528cba

      - name: Install Playwright
        run: |
          mkdir -p /tmp/playwright-env
          cd /tmp/playwright-env
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start Stick server
        run: |
          python3 -m http.server 4173 --directory /tmp/stick >/tmp/stick-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Stick server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stick-server.log
          exit 1

      - name: Capture browser frames
        run: |
          mkdir -p artifacts

          cat > /tmp/playwright-env/stick-test.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1280, height: 800 }
          });

          const errors = [];
          page.on('pageerror', error => errors.push(error.message));

          try {
            await page.goto(
              'http://127.0.0.1:4173/index.html',
              { waitUntil: 'networkidle' }
            );

            const stage = page.locator('#stage');
            await stage.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(1000);

            const markup = await stage.innerHTML();

            if (!markup || markup.trim().length < 20) {
              throw new Error('SVG stage is empty');
            }

            await stage.screenshot({
              path: 'artifacts/stick-frame-00.png'
            });

            const play = page.locator('#btnPlay');

            if (!(await play.count())) {
              throw new Error('Play button not found');
            }

            await play.click();
            await page.waitForTimeout(1200);

            await stage.screenshot({
              path: 'artifacts/stick-frame-01.png'
            });

            if (errors.length) {
              throw new Error(errors.join(' | '));
            }

            console.log('PASS: Stick loaded and 2 frames captured.');

          } finally {
            await browser.close();
          }
          EOF

          cd /tmp/playwright-env
          node stick-test.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stick-visual-test-frames
          path: artifacts/
          if-no-files-found: warn
