
name: Stick Rescue Motion Test

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/stick-visual-feedback-loop
    paths:
      - ".github/workflows/stick-visual-test.yml"

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Stick engine
        run: |
          git clone https://github.com/hmelberg/stick.git /tmp/stick
          git -C /tmp/stick checkout 698e9a783eb2b9e58a762311f8da0670a1528cba

      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/playwright-env
          cd /tmp/playwright-env
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start Stick server
        run: |
          python3 -m http.server 4173 --directory /tmp/stick >/tmp/stick-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Stick server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stick-server.log
          exit 1

      - name: Generate rescue animation and capture frames
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cat > /tmp/playwright-env/stick-test.mjs <<'EOF'
          import { chromium } from 'playwright';

          const scene = {
            v: 1,
            scene: {
              theme: 'blank'
            },
            figures: [
              {
                id: 'rescuer',
                archetype: ['man'],
                style: 'ink',
                pos: { x: 15, y: 70 },
                mood: 'neutral',
                facing: 'right'
              },
              {
                id: 'person',
                archetype: ['man'],
                style: 'ink',
                pos: { x: 62, y: 70 },
                mood: 'sad',
                facing: 'left',
                pose: { base: 'lie' }
              }
            ],
            timeline: [
              {
                at: 0,
                cmd: 'scene.caption',
                args: {
                  text: 'A rescue begins',
                  dur: 'normal'
                }
              },
              {
                at: 0,
                target: 'rescuer',
                cmd: 'move',
                dur: 2.5,
                args: {
                  style: 'walk',
                  to: { x: 42, y: 70 }
                }
              },
              {
                target: 'rescuer',
                cmd: 'pose.tween',
                dur: 0.8,
                args: {
                  base: 'crouch'
                }
              },
              {
                target: 'rescuer',
                cmd: 'reachTo',
                dur: 0.8,
                args: {
                  hand: 'right',
                  to: [55, 66]
                }
              },
              {
                target: 'rescuer',
                cmd: 'reachTo',
                dur: 0.6,
                args: {
                  hand: 'right'
                }
              },
              {
                target: 'rescuer',
                cmd: 'pose.tween',
                dur: 0.8,
                args: {
                  base: 'stand'
                }
              }
            ]
          };

          const browser = await chromium.launch({
            headless: true
          });

          const page = await browser.newPage({
            viewport: {
              width: 1280,
              height: 800
            }
          });

          const errors = [];

          page.on('pageerror', error => {
            errors.push(error.message);
          });

          try {
            await page.goto(
              'http://127.0.0.1:4173/index.html',
              { waitUntil: 'networkidle' }
            );

            await page.waitForFunction(
              () => !!window.StickApp
            );

            await page.evaluate(doc => {
              window.StickApp.setEditor(JSON.stringify(doc));
            }, scene);

            await page.locator('#btnRender').click();

            await page.waitForFunction(
              () => window.StickApp?.state?.rt?.duration > 0
            );

            await page.evaluate(() => {
              window.StickApp.setPlaying(false);
            });

            const duration = await page.evaluate(
              () => window.StickApp.state.rt.duration
            );

            console.log('Animation duration:', duration);

            const stage = page.locator('#stage');

            const childCount = await stage.evaluate(
              el => el.childElementCount
            );

            if (childCount === 0) {
              throw new Error('SVG stage is empty');
            }

            const samples = [
              0,
              0.25,
              0.50,
              0.75,
              1
            ];

            for (let i = 0; i < samples.length; i++) {
              const time = duration * samples[i];

              await page.evaluate(t => {
                window.StickApp.drawAt(t);
              }, time);

              await page.waitForTimeout(150);

              await stage.screenshot({
                path:
                  `${process.env.GITHUB_WORKSPACE}/artifacts/rescue-frame-${i}.png`
              });

              console.log(
                `Captured frame ${i} at ${time.toFixed(2)} seconds`
              );
            }

            if (errors.length > 0) {
              throw new Error(errors.join(' | '));
            }

            console.log('PASS: Custom rescue scene rendered.');
            console.log('PASS: Five animation frames captured.');

          } finally {
            await browser.close();
          }
          EOF

          cd /tmp/playwright-env
          node stick-test.mjs

      - name: Upload rescue animation frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stick-rescue-motion-frames
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
