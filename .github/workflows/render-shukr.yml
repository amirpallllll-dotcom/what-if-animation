name: Render Shukr

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Add Shukr episode
        run: |
          unzip -o shukr_episode.zip -d shukr_pkg
          cd shukr_pkg
          sed "s#S=/workspace/studio#S=$GITHUB_WORKSPACE/studio#" install.sh > i.sh
          sh i.sh

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Prepare browser
        working-directory: studio
        run: npx remotion browser ensure

      - name: Render Shukr
        working-directory: studio
        run: npx remotion render src/index.ts Shukr out/shukr.mp4 --concurrency=2 --timeout=120000

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: shukr-video
          path: studio/out/shukr.mp4
          if-no-files-found: error
          retention-days: 7
