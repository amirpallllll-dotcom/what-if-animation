name: Blender Character Animation Test

on:
  push:
    branches:
      - experiment/blender-grease-pencil-test
  workflow_dispatch:

jobs:
  blender-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Verify Blender
        run: |
          blender --version

      - name: Render character animation
        run: |
          blender --background --python-exit-code 1 --python experiments/blender-grease-pencil-test/create_test.py
          test -s /tmp/blender_test.mp4
          ls -lh /tmp/blender_test.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: blender-character-test
          path: /tmp/blender_test.mp4
          if-no-files-found: error
