name: Render test video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Prepare browser
        working-directory: studio
        run: npx remotion browser ensure

      - name: Render video
        working-directory: studio
        run: npx remotion render src/index.ts rewind out/rewind.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rewind-test-video
          path: studio/out/rewind.mp4
          if-no-files-found: error
          retention-days: 3
