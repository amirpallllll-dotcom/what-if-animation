name: Test render
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Browser
        working-directory: studio
        run: npx remotion browser ensure
      - name: Render
        working-directory: studio
        run: npx remotion render src/test-entry.tsx Trasimene out/test.mp4 --concurrency=2 --timeout=120000
      - uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: studio/out/test.mp4
          if-no-files-found: error
          retention-days: 7
